  <path d="M250 150 L250 480 M550 150 L550 480" stroke="#8b929b" stroke-width="6" stroke-linecap="square"/>
  <path d="M253 480 L547 480" stroke="#c8892a" stroke-width="6"/>
  <path d="M600 300 L640 300" stroke="#c8892a" stroke-width="2" fill="none" stroke-linecap="round"/>
